name: Core native Windows PCIe host
on:
  workflow_call:
    inputs:
      scheduler_run_id:
        description: Scheduler Actions run containing the exact Windows candidate
        type: string
        required: true
      scheduler_commit:
        description: Full Scheduler commit selected by scheduler_run_id
        type: string
        required: true
      sima_cli_run_id:
        description: sima-cli Vulcan CI run containing the exact customer installer
        type: string
        required: true
      sima_cli_commit:
        description: Full sima-cli commit selected by sima_cli_run_id
        type: string
        required: true
      linux_run_id:
        description: Successful Vulcan CI run for this exact Core commit (required for release)
        type: string
        default: ''
      include_genai:
        description: Run GenAI acceptance when the Windows transport is enabled
        type: boolean
        default: false
      validation_only:
        description: Build and qualify without signing or publishing
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      scheduler_run_id:
        description: Scheduler Actions run containing scheduler-native-windows-amd64
        type: string
        required: true
      scheduler_commit:
        description: Full Scheduler commit selected by scheduler_run_id
        type: string
        required: true
      sima_cli_run_id:
        description: sima-cli Vulcan CI run containing sima-cli-dist
        type: string
        required: true
      sima_cli_commit:
        description: Full sima-cli commit selected by sima_cli_run_id
        type: string
        required: true
      linux_run_id:
        description: Successful Vulcan CI run for this exact Core commit (required for release)
        type: string
        default: ''
      include_genai:
        description: Run GenAI acceptance when the Windows transport is enabled
        type: boolean
        default: false
      validation_only:
        description: Build and qualify without signing or publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: core-native-windows-pcie-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 pcie_host/tests/test_windows_ci.py
      - run: >-
          python3 -m py_compile
          scripts/ci/pciehost/build_windows.py
          scripts/ci/pciehost/cleanup_windows_hardware.py
          scripts/ci/pciehost/qualify_windows_hardware.py
          scripts/ci/pciehost/verify_linux_release_run.py
          scripts/ci/pciehost/verify_windows_release.py
          scripts/ci/pciehost/windows_candidate.py
      - run: git diff --check
  linux_release:
    name: Exact Linux build and hardware regressions
    needs: contracts
    if: inputs.validation_only != true
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Mint read-only dependency run token
        id: dependency-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.NEAT_RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            scheduler
            sima-cli
          permission-actions: read
          permission-contents: read
      - name: Admit exact successful Vulcan CI run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${{ inputs.linux_run_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release mode requires a numeric linux_run_id." >&2
            exit 1
          fi
          python3 scripts/ci/pciehost/verify_linux_release_run.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${{ inputs.linux_run_id }}" \
            --expected-commit "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/linux-release-admission.json"
      - name: Admit exact successful sima-cli run
        env:
          GITHUB_TOKEN: ${{ steps.dependency-token.outputs.token }}
        run: |
          if [[ ! "${{ inputs.sima_cli_run_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release mode requires a numeric sima_cli_run_id." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.sima_cli_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release mode requires a full lowercase sima_cli_commit." >&2
            exit 1
          fi
          python3 scripts/ci/pciehost/verify_linux_release_run.py \
            --repository "sima-neat/sima-cli" \
            --run-id "${{ inputs.sima_cli_run_id }}" \
            --expected-commit "${{ inputs.sima_cli_commit }}" \
            --output "${RUNNER_TEMP}/sima-cli-release-admission.json"
      - name: Admit exact successful Scheduler Windows run
        env:
          GITHUB_TOKEN: ${{ steps.dependency-token.outputs.token }}
        run: |
          if [[ ! "${{ inputs.scheduler_run_id }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release mode requires a numeric scheduler_run_id." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.scheduler_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release mode requires a full lowercase scheduler_commit." >&2
            exit 1
          fi
          python3 scripts/ci/pciehost/verify_linux_release_run.py \
            --repository "sima-neat/scheduler" \
            --run-id "${{ inputs.scheduler_run_id }}" \
            --expected-commit "${{ inputs.scheduler_commit }}" \
            --workflow-name "Scheduler native Windows PCIe host" \
            --workflow-path ".github/workflows/pcie-host-windows.yml" \
            --output "${RUNNER_TEMP}/scheduler-release-admission.json"
      - name: Retain Linux release admission
        uses: actions/upload-artifact@v6
        with:
          name: core-pciehost-linux-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-release-admission.json
            ${{ runner.temp }}/scheduler-release-admission.json
            ${{ runner.temp }}/sima-cli-release-admission.json
          if-no-files-found: error
          retention-days: 14
  native:
    name: Native Windows amd64 cohort
    needs: contracts
    if: github.repository == 'sima-neat/core' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'sima-neat/core')
    environment: production
    runs-on: [self-hosted, Windows, X64, pcie-windows-build, default]
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      GSTREAMER_ROOT_X86_64: ${{ vars.GSTREAMER_ROOT_X86_64 }}
      SIMA_WINDOWS_CMAKE_PREFIX_PATH: ${{ vars.SIMA_WINDOWS_CMAKE_PREFIX_PATH }}
      SIMA_WINDOWS_PLATFORM_RUNTIME_DIR: ${{ vars.SIMA_WINDOWS_PLATFORM_RUNTIME_DIR }}
      SIMA_WINDOWS_PYTHON_WHEELHOUSE: ${{ vars.SIMA_WINDOWS_PYTHON_WHEELHOUSE }}
      SIMA_WINDOWS_SIGNING_CERTIFICATE_SHA1: ${{ vars.SIMA_WINDOWS_SIGNING_CERTIFICATE_SHA1 }}
      SIMA_WINDOWS_SIGNING_MACHINE_STORE: ${{ vars.SIMA_WINDOWS_SIGNING_MACHINE_STORE }}
      SIMA_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.SIMA_WINDOWS_SIGNING_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Mint read-only Scheduler artifact token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.NEAT_RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scheduler
          permission-actions: read
          permission-contents: read
      - name: Download exact Scheduler Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: scheduler-native-windows-amd64
          path: ${{ runner.temp }}/scheduler-windows-candidate
          repository: sima-neat/scheduler
          run-id: ${{ inputs.scheduler_run_id }}
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Build, test, package, install, and remove Core cohort
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio x64 C++ tools are unavailable" }
          Import-Module (Join-Path $installation "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          foreach ($name in @(
            "GSTREAMER_ROOT_X86_64",
            "SIMA_WINDOWS_PLATFORM_RUNTIME_DIR",
            "SIMA_WINDOWS_PYTHON_WHEELHOUSE"
          )) {
            if (-not (Get-Item "env:$name").Value) { throw "Required producer variable is unset: $name" }
          }
          $arguments = @(
            "scripts/ci/pciehost/build_windows.py",
            "--branch", $env:SOURCE_BRANCH,
            "--expected-scheduler-commit", "${{ inputs.scheduler_commit }}",
            "--gstreamer-root", $env:GSTREAMER_ROOT_X86_64,
            "--platform-runtime", $env:SIMA_WINDOWS_PLATFORM_RUNTIME_DIR,
            "--python-wheelhouse", $env:SIMA_WINDOWS_PYTHON_WHEELHOUSE,
            "--scheduler-candidate", "$env:RUNNER_TEMP\scheduler-windows-candidate",
            "--work", "$env:RUNNER_TEMP\core-windows-build",
            "--output", "$env:RUNNER_TEMP\core-windows-dist"
          )
          if ($env:SIMA_WINDOWS_CMAKE_PREFIX_PATH) {
            foreach ($prefix in $env:SIMA_WINDOWS_CMAKE_PREFIX_PATH.Split(";")) {
              if ($prefix) { $arguments += @("--dependency-prefix", $prefix) }
            }
          }
          if ("${{ inputs.validation_only }}" -ne "true") {
            if (-not $env:SIMA_WINDOWS_SIGNING_CERTIFICATE_SHA1) {
              throw "Release mode requires SIMA_WINDOWS_SIGNING_CERTIFICATE_SHA1"
            }
            $arguments += @(
              "--require-signatures",
              "--signing-certificate-sha1", $env:SIMA_WINDOWS_SIGNING_CERTIFICATE_SHA1
            )
            if ($env:SIMA_WINDOWS_SIGNING_TIMESTAMP_URL) {
              $arguments += @("--signing-timestamp-url", $env:SIMA_WINDOWS_SIGNING_TIMESTAMP_URL)
            }
            if ($env:SIMA_WINDOWS_SIGNING_MACHINE_STORE -eq "true") {
              $arguments += "--signing-machine-store"
            }
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows Core producer failed: $LASTEXITCODE" }
      - name: Retain Core Windows cohort and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-pciehost-windows-amd64
          path: ${{ runner.temp }}/core-windows-dist/*
          if-no-files-found: error
          retention-days: 7
  hardware:
    name: Direct-card Windows acceptance
    needs: native
    if: needs.native.result == 'success'
    concurrency:
      group: core-windows-pcie-hardware-card0
      cancel-in-progress: false
    environment: production
    runs-on: [self-hosted, Windows, X64, pcie-windows-hardware, default]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      GSTREAMER_ROOT_X86_64: ${{ vars.GSTREAMER_ROOT_X86_64 }}
      SIMA_WINDOWS_CMAKE_PREFIX_PATH: ${{ vars.SIMA_WINDOWS_CMAKE_PREFIX_PATH }}
      SIMA_WINDOWS_PLATFORM_RUNTIME_DIR: ${{ vars.SIMA_WINDOWS_PLATFORM_RUNTIME_DIR }}
      SIMA_WINDOWS_PYTHON_WHEELHOUSE: ${{ vars.SIMA_WINDOWS_PYTHON_WHEELHOUSE }}
      SIMAPCIE_BOXDECODE_IMAGE: ${{ vars.SIMA_WINDOWS_PCIE_BOXDECODE_IMAGE }}
      SIMAPCIE_CARD_GST_DEBUG: ${{ vars.SIMAPCIE_PCIEHOST_CARD_GST_DEBUG }}
      SIMAPCIE_CARD_HOST: ${{ vars.SIMA_WINDOWS_PCIE_CARD_HOST }}
      SIMAPCIE_CARD_ID: "0"
      SIMAPCIE_EXPECTED_CARD_RUNTIME_SHA256: ${{ vars.SIMA_WINDOWS_PCIE_EXPECTED_CARD_RUNTIME_SHA256 }}
      SIMAPCIE_EXPECTED_CARD_WORKER_SHA256: ${{ vars.SIMA_WINDOWS_PCIE_EXPECTED_CARD_WORKER_SHA256 }}
      SIMAPCIE_EXPECTED_CARD_GENAI_WORKER_SHA256: ${{ vars.SIMA_WINDOWS_PCIE_EXPECTED_CARD_GENAI_WORKER_SHA256 }}
      SIMAPCIE_GENAI_MODELS_PATH: ${{ vars.SIMA_WINDOWS_PCIE_GENAI_MODELS_PATH }}
      SIMAPCIE_GENAI_TEST_ASSETS: ${{ vars.SIMA_WINDOWS_PCIE_GENAI_TEST_ASSETS }}
      SIMAPCIE_LIFECYCLE_CYCLES: "10"
      SIMAPCIE_LIFETIME_ITERATIONS: "20"
      SIMAPCIE_MLA_ONLY_BF16_MODEL: ${{ vars.SIMA_WINDOWS_PCIE_MLA_ONLY_BF16_MODEL }}
      SIMAPCIE_MLA_ONLY_MODEL: ${{ vars.SIMA_WINDOWS_PCIE_MLA_ONLY_MODEL }}
      SIMAPCIE_PULL_TIMEOUT_MS: "30000"
      SIMAPCIE_READINESS_TIMEOUT_MS: "180000"
      SIMAPCIE_SSH_KEY: ${{ vars.SIMA_WINDOWS_PCIE_SSH_KEY }}
      SIMAPCIE_STRESS_ITERATIONS: "1000"
      SIMAPCIE_STRESS_QUEUES: "0 1 2 3 4 5"
      SIMAPCIE_SYNC_ITERATIONS: "50"
      SIMAPCIE_TEST_IMAGE: ${{ vars.SIMA_WINDOWS_PCIE_TEST_IMAGE }}
      SIMAPCIE_TEST_ITERATIONS: "1000"
      SIMAPCIE_TEST_REQUIREMENTS: ${{ vars.SIMA_WINDOWS_PCIE_TEST_REQUIREMENTS }}
      SIMAPCIE_USER: "sima"
      SIMAPCIE_YOLOV8_MODEL: ${{ vars.SIMA_WINDOWS_PCIE_YOLOV8_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: core-pciehost-windows-amd64
          path: ${{ runner.temp }}/core-windows-candidate
      - name: Mint read-only sima-cli artifact token
        id: sima-cli-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.NEAT_RELEASES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sima-cli
          permission-actions: read
          permission-contents: read
      - name: Download exact sima-cli customer installer
        uses: actions/download-artifact@v4
        with:
          name: sima-cli-dist
          path: ${{ runner.temp }}/sima-cli-candidate
          repository: sima-neat/sima-cli
          run-id: ${{ inputs.sima_cli_run_id }}
          github-token: ${{ steps.sima-cli-token.outputs.token }}
      - name: Install, test both APIs, and remove exact cohort
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.validation_only }}" -ne "true" -and "${{ inputs.include_genai }}" -ne "true") {
            throw "Customer release requires the complete Windows GenAI hardware matrix"
          }
          foreach ($name in @(
            "GSTREAMER_ROOT_X86_64",
            "SIMA_WINDOWS_PLATFORM_RUNTIME_DIR",
            "SIMA_WINDOWS_PYTHON_WHEELHOUSE",
            "SIMAPCIE_CARD_HOST",
            "SIMAPCIE_EXPECTED_CARD_RUNTIME_SHA256",
            "SIMAPCIE_EXPECTED_CARD_WORKER_SHA256",
            "SIMAPCIE_SSH_KEY",
            "SIMAPCIE_YOLOV8_MODEL",
            "SIMAPCIE_MLA_ONLY_MODEL",
            "SIMAPCIE_MLA_ONLY_BF16_MODEL",
            "SIMAPCIE_TEST_IMAGE",
            "SIMAPCIE_BOXDECODE_IMAGE"
          )) {
            if (-not (Get-Item "env:$name").Value) { throw "Required hardware variable is unset: $name" }
          }
          $arguments = @(
            "scripts/ci/pciehost/qualify_windows_hardware.py",
            "--candidate", "$env:RUNNER_TEMP\core-windows-candidate",
            "--card-host", $env:SIMAPCIE_CARD_HOST,
            "--expected-card-runtime-sha256", $env:SIMAPCIE_EXPECTED_CARD_RUNTIME_SHA256,
            "--expected-card-worker-sha256", $env:SIMAPCIE_EXPECTED_CARD_WORKER_SHA256,
            "--expected-sima-cli-commit", "${{ inputs.sima_cli_commit }}",
            "--gstreamer-root", $env:GSTREAMER_ROOT_X86_64,
            "--lock-file", "$env:USERPROFILE\.sima\locks\neat-pcie-card0.lock",
            "--platform-runtime", $env:SIMA_WINDOWS_PLATFORM_RUNTIME_DIR,
            "--python-wheelhouse", $env:SIMA_WINDOWS_PYTHON_WHEELHOUSE,
            "--sima-cli-candidate", "$env:RUNNER_TEMP\sima-cli-candidate",
            "--source-root", $env:GITHUB_WORKSPACE,
            "--ssh-key", $env:SIMAPCIE_SSH_KEY,
            "--work", "$env:RUNNER_TEMP\core-windows-hardware",
            "--evidence", "$env:RUNNER_TEMP\core-windows-hardware-evidence"
          )
          if ("${{ inputs.include_genai }}" -eq "true") {
            if (-not $env:SIMAPCIE_EXPECTED_CARD_GENAI_WORKER_SHA256) {
              throw "GenAI qualification requires SIMAPCIE_EXPECTED_CARD_GENAI_WORKER_SHA256"
            }
            $arguments += @(
              "--include-genai",
              "--expected-card-genai-worker-sha256", $env:SIMAPCIE_EXPECTED_CARD_GENAI_WORKER_SHA256
            )
          }
          if ($env:SIMA_WINDOWS_CMAKE_PREFIX_PATH) {
            foreach ($prefix in $env:SIMA_WINDOWS_CMAKE_PREFIX_PATH.Split(";")) {
              if ($prefix) { $arguments += @("--dependency-prefix", $prefix) }
            }
          }
          if ($env:SIMAPCIE_TEST_REQUIREMENTS) {
            foreach ($requirement in $env:SIMAPCIE_TEST_REQUIREMENTS.Split(";")) {
              if ($requirement) { $arguments += @("--test-requirement", $requirement) }
            }
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows hardware qualification failed: $LASTEXITCODE" }
      - name: Recover card and native installation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & python scripts/ci/pciehost/cleanup_windows_hardware.py `
            --candidate "$env:RUNNER_TEMP\core-windows-candidate" `
            --card-host $env:SIMAPCIE_CARD_HOST `
            --evidence "$env:RUNNER_TEMP\core-windows-hardware-evidence" `
            --lock-file "$env:USERPROFILE\.sima\locks\neat-pcie-card0.lock" `
            --ssh-key $env:SIMAPCIE_SSH_KEY `
            --work "$env:RUNNER_TEMP\core-windows-hardware"
          if ($LASTEXITCODE -ne 0) { throw "Windows hardware recovery failed: $LASTEXITCODE" }
      - name: Enforce release admission
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @(
            "scripts/ci/pciehost/verify_windows_release.py",
            "--candidate", "$env:RUNNER_TEMP\core-windows-candidate",
            "--qualification", "$env:RUNNER_TEMP\core-windows-hardware-evidence\hardware-qualification.json",
            "--expected-commit", $env:GITHUB_SHA,
            "--output", "$env:RUNNER_TEMP\core-windows-hardware-evidence\release-admission.json"
          )
          if ("${{ inputs.validation_only }}" -ne "true") {
            $arguments += @("--require-signatures", "--require-genai")
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Windows release admission failed: $LASTEXITCODE" }
      - name: Retain direct-card evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-pciehost-windows-hardware-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-windows-hardware-evidence/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish qualified Windows cohort
    needs: [hardware, linux_release]
    if: inputs.validation_only != true && needs.hardware.result == 'success' && needs.linux_release.result == 'success'
    permissions:
      contents: read
      actions: write
      id-token: write
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@58c7dc729d9e995631578cfc33643613d81d44a4
    with:
      environment_name: production
      artifact_namespace: core
      source_branch: ${{ github.head_ref || github.ref_name }}
      source_commit: ${{ github.sha }}
      artifact_folder: pciehost/windows/amd64
      artifact_pattern: core-pciehost-windows-amd64
      artifact_glob: '*'
      publish_manifest: true
      cleanup_github_artifacts: false
