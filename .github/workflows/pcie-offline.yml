name: PCIe Offline Bundles

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      publish_branch:
        description: Publish ready same-branch packages from the gated caller or explicit manual dispatch
        required: false
        default: false
        type: boolean
      validation_only:
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [Vulcan CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Vulcan CI push run to assemble (develop/main/release-* or tag)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: pcie-offline-run-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  source:
    name: Admit successful source publication
    if: ${{ inputs.validation_only || inputs.publish_branch || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'develop') }}
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
      sha: ${{ steps.source.outputs.sha }}
      ref: ${{ steps.source.outputs.ref }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
          PUBLISH_BRANCH: ${{ inputs.publish_branch || false }}
        run: |
          options=()
          if [[ "$VALIDATION_ONLY" == true || "$PUBLISH_BRANCH" == true ]]; then
            options+=(--validation-ref "$GITHUB_REF_NAME")
          fi
          python3 -B pcie_host/scripts/offline/resolve_run.py --run-id "$SOURCE_RUN" "${options[@]}"

  config:
    needs: source
    if: ${{ needs.source.outputs.enabled == 'true' }}
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'production' }}

  prepare-card:
    name: Prepare shared clean card baseline
    needs: [source, config]
    environment: ${{ needs.config.outputs.vulcan_env }}
    runs-on: [self-hosted, linux, arm64, "vulcan-${{ needs.config.outputs.vulcan_env }}", ubuntu, default]
    timeout-minutes: 45
    outputs:
      cache_key: ${{ steps.key.outputs.card }}
      ubuntu22-amd64: ${{ steps.key.outputs.ubuntu22-amd64 }}
      ubuntu24-amd64: ${{ steps.key.outputs.ubuntu24-amd64 }}
      ubuntu22-arm64: ${{ steps.key.outputs.ubuntu22-arm64 }}
      ubuntu24-arm64: ${{ steps.key.outputs.ubuntu24-arm64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Set baseline cache directory
        run: echo "OFFLINE_BASELINE_CACHE=$RUNNER_TEMP/offline-baselines" >> "$GITHUB_ENV"
      - name: Install publication client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/offline-aws"
          "$RUNNER_TEMP/offline-aws/bin/pip" install awscli==1.42.49
          echo "$RUNNER_TEMP/offline-aws/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-to-assume: ${{ needs.config.outputs.artifact_publisher_role_arn }}
          role-session-name: offline-card-${{ github.run_id }}
      - id: key
        name: Resolve baseline cache identities from immutable publications
        env:
          ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
          SOURCE_REF: ${{ needs.source.outputs.ref }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 -B pcie_host/scripts/offline/ci.py cache-keys \
            --bucket "$ARTIFACT_BUCKET" --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --work "$RUNNER_TEMP/baseline-keys"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/offline-baselines/card
          key: ${{ steps.key.outputs.card }}
      - name: Prepare baseline with the pinned SDK image
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
          SOURCE_REF: ${{ needs.source.outputs.ref }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 -B pcie_host/scripts/offline/ci.py build --core --prepare-card --validation-only \
            --bucket "$ARTIFACT_BUCKET" --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --installer-revision "$GITHUB_SHA" --work "$RUNNER_TEMP/card-preparation" \
            2>&1 | tee "$RUNNER_TEMP/card-preparation.log"
      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-card-preparation
          path: ${{ runner.temp }}/card-preparation.log
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Assemble offline ${{ matrix.distro }} ${{ matrix.arch }}
    needs: [source, config, prepare-card]
    environment: ${{ needs.config.outputs.vulcan_env }}
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", "vulcan-${{ needs.config.outputs.vulcan_env }}", ubuntu, default]
    env:
      OFFLINE_CARD_REQUIRED: 'true'
    timeout-minutes: 90
    concurrency:
      group: pcie-offline-build-${{ needs.source.outputs.ref }}-${{ needs.source.outputs.sha }}-${{ matrix.distro }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: ubuntu22, arch: amd64}
          - {distro: ubuntu24, arch: amd64}
          - {distro: ubuntu22, arch: arm64}
          - {distro: ubuntu24, arch: arm64}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Set baseline cache directory
        run: echo "OFFLINE_BASELINE_CACHE=$RUNNER_TEMP/offline-baselines" >> "$GITHUB_ENV"
      - name: Restore shared clean card baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/offline-baselines/card
          key: ${{ needs.prepare-card.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Cache clean host baseline
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/offline-baselines/${{ matrix.distro }}-${{ matrix.arch }}
          key: ${{ needs.prepare-card.outputs[format('{0}-{1}', matrix.distro, matrix.arch)] }}
      - name: Enable ARM64 card-container validation on AMD64
        if: ${{ matrix.arch == 'amd64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install publication client with conditional-write support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/offline-aws"
          "$RUNNER_TEMP/offline-aws/bin/pip" install awscli==1.42.49
          echo "$RUNNER_TEMP/offline-aws/bin" >> "$GITHUB_PATH"
      - name: Authenticate existing PCIe build images
        run: |
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 069171140053.dkr.ecr.us-west-2.amazonaws.com
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-to-assume: ${{ needs.config.outputs.artifact_publisher_role_arn }}
          role-session-name: offline-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.run_id }}
      - name: Acquire published assets, assemble, validate offline, and stage
        env:
          SOURCE_REF: ${{ needs.source.outputs.ref }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_RUN: ${{ needs.source.outputs.run_id }}
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
          KMS_KEY: ${{ needs.config.outputs.artifact_kms_key_id }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$VALIDATION_ONLY" == true ]]; then
            options+=(--validation-only)
          fi
          python3 -B pcie_host/scripts/offline/ci.py build "${options[@]}" \
            --bucket "$ARTIFACT_BUCKET" --kms "$KMS_KEY" \
            --ref "$SOURCE_REF" --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN" \
            --installer-revision "$GITHUB_SHA" --distro "$DISTRO" --arch "$ARCH" \
            --work "$RUNNER_TEMP/offline" 2>&1 | tee "$RUNNER_TEMP/offline-build.log"
      - name: Retain validated pre-merge bundle
        if: ${{ inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/offline/neat-pcie-offline-installer.tar.gz
            ${{ runner.temp }}/offline/metadata-offline.json
          if-no-files-found: error
          retention-days: 3
      - name: Retain assembly evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/offline-build.log
            ${{ runner.temp }}/offline/spec.json
            ${{ runner.temp }}/offline/metadata-offline.json
            ${{ runner.temp }}/offline/neat-offline/bundle.json
          if-no-files-found: ignore
          retention-days: 3

  build-core:
    name: Assemble standalone Core offline
    needs: [source, config, prepare-card]
    environment: ${{ needs.config.outputs.vulcan_env }}
    runs-on: [self-hosted, linux, arm64, "vulcan-${{ needs.config.outputs.vulcan_env }}", ubuntu, default]
    env:
      OFFLINE_CARD_REQUIRED: 'true'
    timeout-minutes: 90
    concurrency:
      group: pcie-offline-build-${{ needs.source.outputs.ref }}-${{ needs.source.outputs.sha }}-core
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Set baseline cache directory
        run: echo "OFFLINE_BASELINE_CACHE=$RUNNER_TEMP/offline-baselines" >> "$GITHUB_ENV"
      - name: Restore shared clean card baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/offline-baselines/card
          key: ${{ needs.prepare-card.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install publication client with conditional-write support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/offline-aws"
          "$RUNNER_TEMP/offline-aws/bin/pip" install awscli==1.42.49
          echo "$RUNNER_TEMP/offline-aws/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-to-assume: ${{ needs.config.outputs.artifact_publisher_role_arn }}
          role-session-name: offline-core-${{ github.run_id }}
      - name: Acquire published assets, assemble, validate offline, and stage
        env:
          SOURCE_REF: ${{ needs.source.outputs.ref }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_RUN: ${{ needs.source.outputs.run_id }}
          ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
          KMS_KEY: ${{ needs.config.outputs.artifact_kms_key_id }}
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$VALIDATION_ONLY" == true ]]; then
            options+=(--validation-only)
          fi
          python3 -B pcie_host/scripts/offline/ci.py build --core "${options[@]}" \
            --bucket "$ARTIFACT_BUCKET" --kms "$KMS_KEY" \
            --ref "$SOURCE_REF" --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN" \
            --installer-revision "$GITHUB_SHA" \
            --work "$RUNNER_TEMP/offline" 2>&1 | tee "$RUNNER_TEMP/offline-build.log"
      - name: Retain validated pre-merge bundle
        if: ${{ inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-core
          path: |
            ${{ runner.temp }}/offline/neat-core-offline-installer.tar.gz
            ${{ runner.temp }}/offline/*-Linux-extras.tar.gz
            ${{ runner.temp }}/offline/metadata.json
            ${{ runner.temp }}/offline/metadata-minimal.json
          if-no-files-found: error
          retention-days: 3
      - name: Retain assembly evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-core
          path: |
            ${{ runner.temp }}/offline-build.log
            ${{ runner.temp }}/offline/spec.json
            ${{ runner.temp }}/offline/metadata.json
            ${{ runner.temp }}/offline/metadata-minimal.json
            ${{ runner.temp }}/offline/neat-core-offline/bundle.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    if: ${{ !inputs.validation_only }}
    name: Publish all offline metadata
    needs: [source, config, build, build-core]
    environment: ${{ needs.config.outputs.vulcan_env }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pcie-offline-publish-${{ needs.source.outputs.ref }}-${{ needs.source.outputs.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Install publication client with conditional-write support
        run: |
          python3 -m venv "$RUNNER_TEMP/offline-aws"
          "$RUNNER_TEMP/offline-aws/bin/pip" install awscli==1.42.49
          echo "$RUNNER_TEMP/offline-aws/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-to-assume: ${{ needs.config.outputs.artifact_publisher_role_arn }}
          role-session-name: offline-publish-${{ github.run_id }}
      - name: Verify all staged tuples and expose download-only metadata
        env:
          SOURCE_REF: ${{ needs.source.outputs.ref }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          ARTIFACT_BUCKET: ${{ needs.config.outputs.artifact_bucket }}
          KMS_KEY: ${{ needs.config.outputs.artifact_kms_key_id }}
          DISTRIBUTION: ${{ needs.config.outputs.artifact_cloudfront_distribution_id }}
        run: |
          python3 -B pcie_host/scripts/offline/ci.py publish \
            --bucket "$ARTIFACT_BUCKET" --kms "$KMS_KEY" \
            --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --distribution "$DISTRIBUTION" --work "$RUNNER_TEMP/offline-publish"
