name: Zero Skip Gate

on:
  workflow_dispatch: {}

# The canonical build enables guarded registrations and uses the configured
# device owner. Do not configure/build/plain-ctest ARM tests on an Ubuntu host.
jobs:
  canonical-core:
    uses: ./.github/workflows/vulcan-ci.yml
    with:
      build_mode: standard
      run_long_tests: false
    secrets: inherit
