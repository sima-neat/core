name: Cleanup Branch Compiler Cache

run-name: Cleanup compiler cache for ${{ github.event.ref || inputs.branch }}

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Deleted branch name whose compiler cache should be removed.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-vulcan-config:
    name: Resolve Vulcan Config
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'production' }}

  cleanup:
    name: Delete Branch Cache
    needs:
      - resolve-vulcan-config
    runs-on: ubuntu-latest
    environment: ${{ vars.VULCAN_ENV || 'production' }}

    steps:
      - name: Configure compiler-cache cleanup credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.compiler_cache_aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.compiler_cache_cleanup_role_arn }}
          role-session-name: compiler-cache-cleanup-${{ github.run_id }}

      - name: Delete branch compiler-cache prefixes
        shell: bash
        env:
          CACHE_BUCKET: ${{ needs.resolve-vulcan-config.outputs.compiler_cache_bucket }}
          CACHE_KEY_PREFIX: ${{ needs.resolve-vulcan-config.outputs.compiler_cache_key_prefix }}
          DELETED_BRANCH: ${{ github.event.ref || inputs.branch }}
        run: |
          set -euo pipefail

          encoded_branch="$(python3 - "${DELETED_BRANCH}" <<'PY'
          import sys
          from urllib.parse import quote

          print(quote(sys.argv[1], safe=""))
          PY
          )"

          test -n "${encoded_branch}"
          branch_root="${CACHE_KEY_PREFIX}/sccache-v1"

          mapfile -t prefixes < <(
            aws s3api list-objects-v2 \
              --bucket "${CACHE_BUCKET}" \
              --prefix "${branch_root}/" \
              --query "Contents[].Key" \
              --output json |
              python3 -c '
          import json
          import sys

          needle = f"/branches/{sys.argv[1]}/"
          prefixes = set()
          for key in json.load(sys.stdin) or []:
              marker = key.find(needle)
              if marker >= 0:
                  prefixes.add(key[: marker + len(needle)])
          for prefix in sorted(prefixes):
              print(prefix)
          ' "${encoded_branch}"
          )

          if [[ "${#prefixes[@]}" -eq 0 ]]; then
            echo "No compiler cache found for deleted branch '${DELETED_BRANCH}'."
            exit 0
          fi

          for prefix in "${prefixes[@]}"; do
            case "${prefix}" in
              "${branch_root}/"*/branches/"${encoded_branch}/") ;;
              *)
                echo "Refusing to delete unexpected compiler-cache prefix: ${prefix}" >&2
                exit 1
                ;;
            esac
            echo "Deleting s3://${CACHE_BUCKET}/${prefix}"
            aws s3 rm "s3://${CACHE_BUCKET}/${prefix}" --recursive --only-show-errors
          done
