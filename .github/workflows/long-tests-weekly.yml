name: Long Tests Weekly

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

jobs:
  long-tests:
    name: long-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: ./build.sh --install-deps-only

      - name: Configure
        run: cmake -S . -B build-long-tests

      - name: Build
        run: cmake --build build-long-tests -j8

      - name: Run Modalix preflight
        run: ctest --test-dir build-long-tests --output-on-failure -R "^unit_modalix_contract_preflight_test$"

      - name: Run long tests only
        env:
          SIMA_TEST_IS_LONG: "1"
        run: |
          ctest --test-dir build-long-tests \
            --label-regex "long" \
            --output-on-failure \
            --no-tests=error

  modalix-python-long-tests:
    name: modalix-python-long-tests
    uses: ./.github/workflows/vulcan-ci.yml
    with:
      build_mode: standard
      run_long_tests: true
    secrets: inherit
