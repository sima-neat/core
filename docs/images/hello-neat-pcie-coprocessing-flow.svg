<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 400" role="img" aria-labelledby="title desc">
  <title id="title">PCIe Co-processing flow</title>
  <desc id="desc">An animated flow showing a host machine reading, resizing, and normalizing an RGB image, sending the prepared tensor over PCIe to a Modalix PCIe Card for ResNet-50 inference, and receiving a classification result.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1240" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F8F6"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5998DD"/><stop offset="1" stop-color="#7EB4EC"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2A9C4F"/><stop offset="1" stop-color="#8DD4AA"/></linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="145%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#010F0E" flood-opacity="0.12"/></filter>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2A9C4F"/></marker>
    <style>
      .sans{font-family:"Avenir Next","Segoe UI",Arial,sans-serif}.title{fill:#010F0E;font-size:28px;font-weight:700}.panel{fill:#010F0E;font-size:21px;font-weight:700}.label{fill:#010F0E;font-size:17px;font-weight:650}.small{fill:#35536F;font-size:14px;font-weight:500}.tag{fill:#FFF;font-size:13px;font-weight:700;letter-spacing:.04em}
    </style>
  </defs>
  <rect x="16" y="16" width="1288" height="368" rx="30" fill="url(#bg)" stroke="#D8E7F1"/>
  <circle cx="1190" cy="74" r="52" fill="#C0E8DB" opacity=".58"/><circle cx="104" cy="340" r="38" fill="#D1CEE6" opacity=".48"/>
  <text x="54" y="68" class="sans title">PCIe Co-processing flow</text>
  <text x="54" y="96" class="sans small">Prepare input on the host machine, execute the model on the card, and return the result.</text>

  <g filter="url(#shadow)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.04;.07;1"/>
    <rect x="91" y="130" width="500" height="190" rx="28" fill="#FFF" stroke="#A9CDED" stroke-width="2"/><rect x="117" y="153" width="132" height="34" rx="17" fill="url(#blue)"/><text x="183" y="176" class="sans tag" text-anchor="middle">HOST MACHINE</text>
    <text x="341" y="219" class="sans panel" text-anchor="middle">PCIe application</text><rect x="129" y="247" width="100" height="50" rx="16" fill="#F5FAFF" stroke="#A9CDED"/><text x="179" y="277" class="sans label" text-anchor="middle">Read</text>
    <line x1="239" y1="272" x2="264" y2="272" stroke="#2A9C4F" stroke-width="3" marker-end="url(#greenArrow)"/><rect x="276" y="247" width="110" height="50" rx="16" fill="#F5FAFF" stroke="#A9CDED"/><text x="331" y="277" class="sans label" text-anchor="middle">Resize</text>
    <line x1="396" y1="272" x2="421" y2="272" stroke="#2A9C4F" stroke-width="3" marker-end="url(#greenArrow)"/><rect x="433" y="247" width="120" height="50" rx="16" fill="#F5FAFF" stroke="#A9CDED"/><text x="493" y="277" class="sans label" text-anchor="middle">Normalize</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.20;.23;1"/><line x1="604" y1="210" x2="715" y2="210" stroke="#2A9C4F" stroke-width="4" marker-end="url(#greenArrow)"/><rect x="613" y="162" width="94" height="27" rx="14" fill="url(#green)"/><text x="660" y="181" class="sans tag" text-anchor="middle">PCIe INPUT</text></g>

  <g filter="url(#shadow)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.30;.33;1"/>
    <rect x="729" y="130" width="500" height="190" rx="28" fill="#FFF" stroke="#9CD5B2" stroke-width="2"/><rect x="755" y="153" width="174" height="34" rx="17" fill="url(#green)"/><text x="842" y="176" class="sans tag" text-anchor="middle">MODALIX PCIE CARD</text><text x="979" y="219" class="sans panel" text-anchor="middle">Compiled model pipeline</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.40;.43;1"/><rect x="769" y="247" width="160" height="50" rx="16" fill="#F3FBF7" stroke="#9CD5B2"/><text x="849" y="269" class="sans label" text-anchor="middle">ResNet-50</text><text x="849" y="288" class="sans small" text-anchor="middle">inference</text></g>

  <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.55;.58;1"/><line x1="939" y1="272" x2="1017" y2="272" stroke="#2A9C4F" stroke-width="3" marker-end="url(#greenArrow)"/><rect x="1029" y="247" width="160" height="50" rx="16" fill="#F3FBF7" stroke="#9CD5B2"/><text x="1109" y="269" class="sans label" text-anchor="middle">Classification</text><text x="1109" y="288" class="sans small" text-anchor="middle">output tensor</text></g>

  <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="1" fill="freeze" values="0;0;1;1" keyTimes="0;.70;.73;1"/><path d="M1109 307V360H341V326" fill="none" stroke="#2A9C4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><rect x="653" y="346" width="144" height="27" rx="14" fill="url(#green)"/><text x="725" y="365" class="sans tag" text-anchor="middle">PCIe OUTPUT</text></g>
</svg>
